[project]
name = "chrom-annotate"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[system-requirements]
linux = "3.10.0"
libc = { family = "glibc", version = "2.17" }

[dependencies]
# workflow orchestration
snakemake = ">=9"
snakemake-executor-plugin-slurm = "*"
python = ">=3.9"

# python: run.neighborhoods.extended.py + neighborhoods.py + tools.py
numpy = "*"
pandas = "*"
pysam = "*"
pybigwig = "*"
pyranges = "*"
scipy = "*"

# R: gather_annotations_for_one_cell_type.R, gather_across_cell_types.R, gather_all_crispr_data.R,
#    chromatin_categories.R
r-base = "*"
r-dplyr = "*"
r-tidyr = "*"
"r-data.table" = "*"
"r-r.utils" = "*"
r-stringr = "*"
r-ggplot2 = "*"

# CLI tools used in shell rules
samtools = "*"
bedtools = "*"
csvtk = "*"
curl = "*"
